<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALERTA</title>
    <style>
        body{background:black;color:red;font-family:monospace;text-align:center;padding-top:20%;}
        button{background:red;color:white;padding:15px 30px;font-size:20px;border:none;border-radius:30px;margin-top:20px;}
        .contador{font-size:60px;margin:20px;}
    </style>
</head>
<body>
    <h1>⚠️ SISTEMA COMPROMETIDO ⚠️</h1>
    <div class="contador" id="contador">00:15</div>
    <button id="boton">TOCAR PARA DETENER</button>
    <p style="color:#660000;">Si no toca en 15s, datos públicos</p>

    <script>
        let segundos = 15;
        function actualizar() {
            document.getElementById("contador").innerText = `00:${segundos.toString().padStart(2,'0')}`;
            if(segundos == 0) {
                clearInterval(timer);
                document.body.innerHTML = "<h1>💀 SISTEMA BLOQUEADO 💀</h1>";
            }
            segundos--;
        }
        let timer = setInterval(actualizar, 1000);
        document.getElementById("boton").onclick = () => {
            clearInterval(timer);
            document.documentElement.requestFullscreen();
            if(navigator.vibrate) navigator.vibrate(1000);
            document.body.innerHTML = "<h1>⛔ FALLO TOTAL ⛔</h1><p>Datos perdidos</p>";
            let audio = new AudioContext();
            let o = audio.createOscillator();
            let g = audio.createGain();
            o.connect(g);
            g.connect(audio.destination);
            o.type = "sawtooth";
            o.frequency.value = 800;
            g.gain.value = 0.3;
            o.start();
            g.gain.exponentialRampToValueAtTime(0.00001, audio.currentTime + 2);
        };
    </script>
</body>
</html>
